<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Universal AR Poster Scanner V5</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    #arContainer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* MindAR injects the live camera video dynamically. */
    #arContainer video:not(#dynamicPosterVideo):not(#cameraPreview),
    body > video:not(#dynamicPosterVideo):not(#cameraPreview) {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 0 !important;
      background: #000 !important;
    }

    /* When AR is paused from the UI, hide the camera visually.
       We pause MindAR instead of destroying it, so Safari can resume
       without requiring a full page refresh. */
    body.ar-paused #arContainer video:not(#dynamicPosterVideo):not(#cameraPreview),
    body.ar-paused > video:not(#dynamicPosterVideo):not(#cameraPreview) {
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* Stable, pre-existing iOS Safari camera preview.
       MindAR still owns the camera stream for tracking; this element simply
       displays the SAME MediaStream without requesting a second camera. */
    #cameraPreview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      visibility: hidden;
      opacity: 0;
      z-index: 0;
      background: #000;
      pointer-events: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    body.ar-live #cameraPreview {
      visibility: visible;
      opacity: 1;
    }

    body.ar-paused #cameraPreview {
      visibility: hidden;
      opacity: 0;
    }

    #arScene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
    }

    #arScene canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      background: #0a0a0a;
    }

    .card {
      width: min(440px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .18em;
      color: #999;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 9vw, 52px);
      line-height: .92;
      letter-spacing: -.05em;
    }

    .desc {
      margin: 0;
      max-width: 380px;
      color: #bcbcbc;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled { opacity: .35; }

    #statusBox {
      min-height: 96px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #ccc;
      font: 10px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #statusBox.good { border-color: rgba(107,255,150,.5); color: #76ff9d; }
    #statusBox.bad { border-color: rgba(255,95,95,.55); color: #ff7777; }

    #scanUI {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      pointer-events: none;
    }

    #scanReticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 420px);
      height: min(68vh, 560px);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 6px;
    }

    #scanReticle::before,
    #scanReticle::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      height: 1px;
      background: rgba(255,255,255,.28);
    }
    #scanReticle::before { top: 33%; }
    #scanReticle::after { bottom: 33%; }

    #scanLabel {
      position: absolute;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: calc(100vw - 28px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 11px;
      letter-spacing: .08em;
      text-align: center;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #topBar {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(0,0,0,.68);
      border: 1px solid rgba(255,255,255,.16);
      color: #fff;
      font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #stopBtn {
      width: auto;
      min-height: 38px;
      padding: 8px 14px;
      pointer-events: auto;
      background: rgba(0,0,0,.72);
      color: #fff;
      border: 1px solid rgba(255,255,255,.22);
      font-size: 11px;
    }

    #errorToast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 20000;
      display: none;
      padding: 12px;
      border-radius: 10px;
      background: rgba(125,0,0,.94);
      color: #fff;
      font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div id="arContainer">
    <video
      id="cameraPreview"
      autoplay
      muted
      playsinline
      webkit-playsinline
      aria-hidden="true"
    ></video>

    <a-scene
      id="arScene"
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets timeout="30000">
        <!-- One reusable video element. Its src is assigned ONLY after a poster is found. -->
        <video
          id="dynamicPosterVideo"
          preload="none"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
          style="position:fixed;left:-8px;top:-8px;width:2px;height:2px;opacity:0.001;pointer-events:none;z-index:-1;"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 200 target anchors are inserted here from posters.json before AR starts. -->
    </a-scene>
  </div>

  <div id="startScreen">
    <div class="card">
      <div class="eyebrow">UNIVERSAL IMAGE-TRACKED WEBAR</div>
      <h1>200 POSTER<br>SCANNER V5</h1>
      <p class="desc">
        One camera experience for up to 200 posters. Each poster can use its own width, height, aspect ratio, and matching animation.
      </p>
      <button id="startBtn" disabled>LOADING…</button>
      <div id="statusBox">Preparing scanner…</div>
    </div>
  </div>

  <div id="scanUI">
    <div id="scanReticle"></div>
    <div id="scanLabel">POINT CAMERA AT A POSTER</div>
  </div>

  <div id="topBar">
    <div id="liveBadge" class="pill">LIVE CAMERA · READY</div>
    <button id="stopBtn">STOP AR</button>
  </div>

  <div id="errorToast"></div>

  <script>
  (() => {
    /* ============================================================
       CONFIG
       ============================================================ */
    const CONFIG = {
      targetFile: './targets.mind',
      manifestFile: './posters.json',
      posterCount: 200,
      maxTrack: 1,
      // Fallback dimensions used only when a posters.json entry does not provide
      // width/height or an explicit ratio.
      defaultWidth: 596,
      defaultHeight: 843,
      defaultRatio: 843 / 596,
      fallbackVideoFolder: './videos/',
      fallbackVideoPrefix: 'poster-',
      fallbackVideoExtension: '.mp4',
      restartAnimationOnFound: true,
      pauseAnimationOnLost: true
    };

    /* ============================================================
       DOM / STATE
       ============================================================ */
    const scene = document.getElementById('arScene');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const scanUI = document.getElementById('scanUI');
    const scanLabel = document.getElementById('scanLabel');
    const topBar = document.getElementById('topBar');
    const liveBadge = document.getElementById('liveBadge');
    const statusBox = document.getElementById('statusBox');
    const errorToast = document.getElementById('errorToast');
    const video = document.getElementById('dynamicPosterVideo');
    const cameraPreview = document.getElementById('cameraPreview');

    let manifest = [];
    let anchorsBuilt = false;
    let starting = false;
    let arRunning = false;
    let activeTargetIndex = null;
    let activeAnchor = null;
    let activeVideoPlane = null;
    let cameraStyleTimer = null;
    let sessionInitialized = false;
    let sessionPaused = false;
    let lastSeenTarget = null;
    let arSystemRef = null;

    /* ============================================================
       HELPERS
       ============================================================ */
    function setStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = '';
      if (type) statusBox.classList.add(type);
    }

    function toast(message) {
      errorToast.textContent = message;
      errorToast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        errorToast.style.display = 'none';
      }, 7000);
    }

    function pad3(n) {
      return String(n).padStart(3, '0');
    }

    function fallbackManifest() {
      return Array.from({ length: CONFIG.posterCount }, (_, i) => ({
        targetIndex: i,
        id: `poster-${pad3(i + 1)}`,
        name: `Poster ${pad3(i + 1)}`,
        video: `${CONFIG.fallbackVideoFolder}${CONFIG.fallbackVideoPrefix}${pad3(i + 1)}${CONFIG.fallbackVideoExtension}`,
        width: CONFIG.defaultWidth,
        height: CONFIG.defaultHeight,
        ratio: CONFIG.defaultRatio,
        loop: true
      }));
    }

    function normalizeEntry(entry, i) {
      const targetIndex = Number.isFinite(Number(entry.targetIndex)) ? Number(entry.targetIndex) : i;

      // V5: every poster can have a different aspect ratio.
      // Preferred format in posters.json:
      //   "width": 596,
      //   "height": 843
      // The scanner calculates height / width automatically.
      //
      // Backwards compatibility:
      // if an older entry already contains "ratio", that value still works.
      const widthValue = Number(entry.width);
      const heightValue = Number(entry.height);
      const explicitRatio = Number(entry.ratio);

      const hasDimensions =
        Number.isFinite(widthValue) && widthValue > 0 &&
        Number.isFinite(heightValue) && heightValue > 0;

      const calculatedRatio = hasDimensions
        ? heightValue / widthValue
        : NaN;

      const finalRatio =
        Number.isFinite(explicitRatio) && explicitRatio > 0
          ? explicitRatio
          : Number.isFinite(calculatedRatio) && calculatedRatio > 0
            ? calculatedRatio
            : CONFIG.defaultRatio;

      return {
        targetIndex,
        id: entry.id || `poster-${pad3(targetIndex + 1)}`,
        name: entry.name || `Poster ${pad3(targetIndex + 1)}`,
        video: entry.video || `${CONFIG.fallbackVideoFolder}${CONFIG.fallbackVideoPrefix}${pad3(targetIndex + 1)}${CONFIG.fallbackVideoExtension}`,
        width: hasDimensions ? widthValue : CONFIG.defaultWidth,
        height: hasDimensions ? heightValue : CONFIG.defaultHeight,
        ratio: Math.max(0.1, finalRatio),
        loop: entry.loop !== false,
        scale: Math.max(0.05, Number(entry.scale) || 1),
        offsetX: Number(entry.offsetX) || 0,
        offsetY: Number(entry.offsetY) || 0,
        rotation: Number(entry.rotation) || 0
      };
    }

    async function loadManifest() {
      try {
        const r = await fetch(`${CONFIG.manifestFile}?v=${Date.now()}`, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const list = Array.isArray(data) ? data : data.posters;
        if (!Array.isArray(list) || !list.length) throw new Error('No poster entries found.');
        manifest = list.map(normalizeEntry).sort((a, b) => a.targetIndex - b.targetIndex);
        return { source: 'posters.json', count: manifest.length };
      } catch (err) {
        console.warn('posters.json unavailable; using filename fallback.', err);
        manifest = fallbackManifest().map(normalizeEntry);
        return { source: 'automatic fallback', count: manifest.length };
      }
    }

    async function checkTargetFile() {
      let r;
      try {
        r = await fetch(`${CONFIG.targetFile}?v=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
      } catch (e) {
        throw new Error(`Could not reach ${CONFIG.targetFile}.`);
      }
      if (!r.ok) throw new Error(`${CONFIG.targetFile} returned HTTP ${r.status}.`);

      const contentType = r.headers.get('content-type') || '';
      const length = Number(r.headers.get('content-length') || 0);
      if (/text\/html/i.test(contentType)) {
        throw new Error(`${CONFIG.targetFile} is returning HTML instead of the MindAR binary. Check the filename/path.`);
      }
      if (length > 0 && length < 256) {
        throw new Error(`${CONFIG.targetFile} is only ${length} bytes. That is almost certainly an error/404 response.`);
      }
      return { length, contentType };
    }

    function waitForScene(timeoutMs = 15000) {
      if (scene.hasLoaded) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('A-Frame scene did not finish loading.')), timeoutMs);
        scene.addEventListener('loaded', () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });
    }

    function forceTransparentRenderer() {
      try {
        if (scene.renderer) {
          scene.renderer.setClearColor(0x000000, 0);
          if (scene.renderer.setClearAlpha) scene.renderer.setClearAlpha(0);
          if (scene.renderer.domElement) scene.renderer.domElement.style.background = 'transparent';
        }
      } catch (_) {}
    }

    function getMindARCameraVideos() {
      return [...document.querySelectorAll('video')].filter(v =>
        v !== video &&
        v !== cameraPreview &&
        v.srcObject instanceof MediaStream
      );
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function prepareVideoElementForIOS(v) {
      if (!v) return;
      v.muted = true;
      v.defaultMuted = true;
      v.autoplay = true;
      v.playsInline = true;
      v.setAttribute('muted', '');
      v.setAttribute('autoplay', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      try { v.disablePictureInPicture = true; } catch (_) {}
    }

    async function bindCameraPreview(cam) {
      if (!cam || !(cam.srcObject instanceof MediaStream)) return false;

      prepareVideoElementForIOS(cam);
      prepareVideoElementForIOS(cameraPreview);

      if (cameraPreview.srcObject !== cam.srcObject) {
        cameraPreview.srcObject = cam.srcObject;
      }

      try {
        const p = cameraPreview.play();
        if (p) await p;
      } catch (err) {
        console.warn('Camera preview play warning:', err);
      }

      return true;
    }

    function styleMindARCameraVideos() {
      const cameraVideos = getMindARCameraVideos();

      cameraVideos.forEach(v => {
        prepareVideoElementForIOS(v);

        // Keep MindAR's own camera video alive for tracking, but don't depend
        // on its dynamically-inserted element for what the user sees.
        Object.assign(v.style, {
          position: 'fixed',
          inset: '0',
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          display: 'block',
          visibility: 'visible',
          opacity: '0.001',
          zIndex: '-1',
          pointerEvents: 'none',
          background: '#000'
        });

        bindCameraPreview(v).catch(() => {});
      });

      forceTransparentRenderer();
      return cameraVideos.length;
    }

    async function waitForActualVideoFrame(videoEl, timeoutMs = 1800) {
      if (!videoEl) throw new Error('Camera preview element is missing.');

      // requestVideoFrameCallback is the most reliable signal that Safari
      // has actually produced a visible video frame.
      if (typeof videoEl.requestVideoFrameCallback === 'function') {
        return await new Promise((resolve, reject) => {
          let done = false;
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            reject(new Error('Camera stream exists, but Safari has not produced a live frame yet.'));
          }, timeoutMs);

          videoEl.requestVideoFrameCallback(() => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve(true);
          });
        });
      }

      const started = performance.now();
      let lastTime = videoEl.currentTime || 0;

      while (performance.now() - started < timeoutMs) {
        await delay(120);
        const nowTime = videoEl.currentTime || 0;
        if (
          videoEl.readyState >= 2 &&
          videoEl.videoWidth > 0 &&
          videoEl.videoHeight > 0 &&
          !videoEl.paused &&
          nowTime > lastTime + 0.01
        ) return true;
        lastTime = nowTime;
      }

      throw new Error('Camera stream exists, but no advancing video frames were detected.');
    }

    async function rebindCameraPreview(stream) {
      if (!(stream instanceof MediaStream)) return;
      try { cameraPreview.pause(); } catch (_) {}
      cameraPreview.srcObject = null;
      await delay(60);
      prepareVideoElementForIOS(cameraPreview);
      cameraPreview.srcObject = stream;
      try {
        const p = cameraPreview.play();
        if (p) await p;
      } catch (_) {}
    }

    async function waitForLiveCamera(timeoutMs = 7000) {
      const started = performance.now();
      let lastPlayError = null;

      while (performance.now() - started < timeoutMs) {
        const cameraVideos = getMindARCameraVideos();

        for (const cam of cameraVideos) {
          try {
            prepareVideoElementForIOS(cam);
            if (cam.paused) {
              const p = cam.play();
              if (p) await p;
            }
            await bindCameraPreview(cam);

            if (
              cameraPreview.readyState >= 2 &&
              cameraPreview.videoWidth > 0 &&
              cameraPreview.videoHeight > 0 &&
              !cameraPreview.paused
            ) {
              try {
                await waitForActualVideoFrame(cameraPreview, 900);
                document.body.classList.add('ar-live');
                return cameraPreview;
              } catch (_) {
                // The stream exists but the preview is frozen. Rebind the SAME
                // stream; this does not call getUserMedia a second time.
                await rebindCameraPreview(cam.srcObject);
                try {
                  await waitForActualVideoFrame(cameraPreview, 900);
                  document.body.classList.add('ar-live');
                  return cameraPreview;
                } catch (_) {}
              }
            }
          } catch (err) {
            lastPlayError = err;
          }
        }

        await delay(100);
      }

      const extra = lastPlayError && lastPlayError.message ? ` Last camera error: ${lastPlayError.message}` : '';
      throw new Error(`Camera permission was granted, but Safari did not produce live camera frames.${extra}`);
    }

    async function kickCameraOnce(arSystem) {
      try {
        if (arSystem && typeof arSystem.pause === 'function' && typeof arSystem.unpause === 'function') {
          arSystem.pause();
          await delay(120);
          arSystem.unpause();
          await delay(160);
          styleMindARCameraVideos();
        }
      } catch (err) {
        console.warn('Camera kick warning:', err);
      }
    }

    async function ensureCameraIsLive(arSystem) {
      try {
        return await waitForLiveCamera(3600);
      } catch (firstError) {
        console.warn('Initial camera wake failed; retrying without requesting a second stream.', firstError);
        await kickCameraOnce(arSystem);
        return await waitForLiveCamera(5200);
      }
    }

    const domObserver = new MutationObserver(() => {
      if (arRunning || starting || sessionInitialized) styleMindARCameraVideos();
    });
    domObserver.observe(document.body, { childList: true, subtree: true });

    function startCameraStyleWatch() {
      clearInterval(cameraStyleTimer);
      cameraStyleTimer = setInterval(() => {
        styleMindARCameraVideos();
        if (arRunning && document.visibilityState === 'visible') {
          getMindARCameraVideos().forEach(cam => {
            if (cam.paused) cam.play().catch(() => {});
          });
          if (cameraPreview.paused && cameraPreview.srcObject) {
            cameraPreview.play().catch(() => {});
          }
        }
      }, 300);
    }

    function stopCameraStyleWatch() {
      clearInterval(cameraStyleTimer);
      cameraStyleTimer = null;
    }

    /* ============================================================
       BUILD 200 TARGET ANCHORS
       ============================================================ */
    function destroyActiveVideoPlane() {
      if (!activeVideoPlane) return;
      try {
        if (activeVideoPlane.parentElement) {
          activeVideoPlane.parentElement.removeChild(activeVideoPlane);
        }
      } catch (_) {}
      activeVideoPlane = null;
    }

    function createActiveVideoPlane(item, anchor) {
      destroyActiveVideoPlane();

      // Create the AR video surface fresh INSIDE the detected target anchor.
      // This is more reliable on mobile than creating one plane in the scene
      // and re-parenting it between 200 different MindAR anchors.
      const plane = document.createElement('a-plane');
      plane.id = `activeVideoPlane-${item.targetIndex}`;

      const planeWidth = item.scale;
      const planeHeight = item.ratio * item.scale;

      plane.setAttribute('geometry', `primitive: plane; width: ${planeWidth}; height: ${planeHeight}`);
      plane.setAttribute('position', `${item.offsetX} ${item.offsetY} 0.015`);
      plane.setAttribute('rotation', `0 0 ${item.rotation}`);
      plane.setAttribute('material', 'shader: flat; src: #dynamicPosterVideo; side: double; transparent: false; depthTest: false; depthWrite: false');
      plane.setAttribute('visible', 'false');

      anchor.appendChild(plane);
      activeVideoPlane = plane;
      return plane;
    }

    function refreshVideoTexture(plane) {
      // A-Frame/three.js normally updates video textures automatically,
      // but forcing an update after a dynamic src change fixes cases where
      // iOS Safari reports the video as playing while the AR plane stays blank.
      const force = () => {
        try {
          const comp = plane && plane.components && plane.components.material;
          const material = comp && comp.material;
          if (material && material.map) {
            material.map.needsUpdate = true;
          }
          if (material) material.needsUpdate = true;
        } catch (_) {}
      };
      requestAnimationFrame(() => {
        force();
        requestAnimationFrame(force);
      });
    }

    function buildTargetAnchors() {
      if (anchorsBuilt) return;

      for (const item of manifest) {
        const anchor = document.createElement('a-entity');
        anchor.id = `target-${item.targetIndex}`;
        anchor.dataset.targetIndex = String(item.targetIndex);
        anchor.setAttribute('mindar-image-target', `targetIndex: ${item.targetIndex}`);

        anchor.addEventListener('targetFound', () => {
          lastSeenTarget = { item, anchor };
          if (arRunning && !sessionPaused) activatePoster(item, anchor);
        });
        anchor.addEventListener('targetLost', () => {
          if (lastSeenTarget && lastSeenTarget.item.targetIndex === item.targetIndex) lastSeenTarget = null;
          deactivatePoster(item, anchor);
        });
        scene.appendChild(anchor);
      }

      anchorsBuilt = true;
    }

    /* ============================================================
       DYNAMIC VIDEO LOADING
       ============================================================ */
    function waitForVideoFirstFrame(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        let done = false;
        const finish = (ok, value) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          if (ok) resolve(value); else reject(value);
        };

        const timer = setTimeout(() => {
          finish(false, new Error('The MP4 started but Safari did not produce a video frame in time.'));
        }, timeoutMs);

        if ('requestVideoFrameCallback' in video) {
          video.requestVideoFrameCallback(() => finish(true));
          return;
        }

        // Fallback for browsers without requestVideoFrameCallback.
        const startedAt = performance.now();
        const poll = () => {
          if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0 && !video.paused) {
            finish(true);
            return;
          }
          if (performance.now() - startedAt > timeoutMs) return;
          requestAnimationFrame(poll);
        };
        poll();
      });
    }

    async function loadAndPlayVideo(item) {
      try { video.pause(); } catch (_) {}

      video.loop = item.loop !== false;
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.autoplay = false;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');

      const wanted = new URL(item.video, window.location.href).href;
      const current = video.currentSrc || video.src || '';

      if (current !== wanted) {
        try { video.pause(); } catch (_) {}
        video.removeAttribute('src');
        try { video.load(); } catch (_) {}
        video.src = item.video;
        video.load();
      }

      await new Promise((resolve, reject) => {
        let settled = false;
        const cleanup = () => {
          video.removeEventListener('loadeddata', onReady);
          video.removeEventListener('canplay', onReady);
          video.removeEventListener('error', onError);
        };
        const finish = (fn, value) => {
          if (settled) return;
          settled = true;
          cleanup();
          fn(value);
        };
        const onReady = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) finish(resolve);
        };
        const onError = () => {
          const mediaError = video.error ? ` MediaError code ${video.error.code}.` : '';
          finish(reject, new Error(`Could not decode ${item.video}.${mediaError} Use an H.264 MP4 for iPhone Safari.`));
        };
        video.addEventListener('loadeddata', onReady, { once: true });
        video.addEventListener('canplay', onReady, { once: true });
        video.addEventListener('error', onError, { once: true });

        if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
          finish(resolve);
        }
      });

      if (CONFIG.restartAnimationOnFound) {
        try { video.currentTime = 0; } catch (_) {}
      }

      await video.play();
      await waitForVideoFirstFrame();

      return {
        width: video.videoWidth,
        height: video.videoHeight,
        duration: Number.isFinite(video.duration) ? video.duration : 0
      };
    }

    async function activatePoster(item, anchor) {
      if (!arRunning) return;

      activeTargetIndex = item.targetIndex;
      activeAnchor = anchor;

      scanLabel.textContent = `${item.name.toUpperCase()} FOUND · LOADING VIDEO…`;
      liveBadge.textContent = `TARGET ${pad3(item.targetIndex + 1)} · ${item.name}`;
      console.log(
        `[AR] ${item.name}: targetIndex=${item.targetIndex}, ` +
        `size=${item.width}×${item.height}, ratio=${item.ratio.toFixed(5)}, video=${item.video}`
      );

      try {
        const info = await loadAndPlayVideo(item);
        if (activeTargetIndex !== item.targetIndex || activeAnchor !== anchor) return;

        const plane = createActiveVideoPlane(item, anchor);

        // Wait until A-Frame has initialized the new plane and its material.
        await new Promise(resolve => {
          if (plane.hasLoaded) return resolve();
          plane.addEventListener('loaded', resolve, { once: true });
          // A-Frame custom elements often initialize before "loaded" can be observed.
          setTimeout(resolve, 250);
        });

        if (activeTargetIndex !== item.targetIndex || activeAnchor !== anchor) return;

        // Re-assign src after the MP4 has a decoded frame, then force the texture refresh.
        plane.setAttribute('material', 'src', '#dynamicPosterVideo');
        refreshVideoTexture(plane);
        plane.setAttribute('visible', 'true');

        scanLabel.textContent = `${item.name.toUpperCase()} · PLAYING`;
        liveBadge.textContent = `${item.name} · ${info.width}×${info.height}`;

        // A second refresh shortly afterwards helps older iOS Safari builds.
        setTimeout(() => refreshVideoTexture(plane), 250);
        setTimeout(() => refreshVideoTexture(plane), 900);
      } catch (err) {
        console.error('VIDEO / TEXTURE ERROR', err);
        destroyActiveVideoPlane();
        scanLabel.textContent = `${item.name.toUpperCase()} · VIDEO ERROR`;
        toast(err.message || String(err));
      }
    }

    function deactivatePoster(item, anchor) {
      if (activeTargetIndex !== item.targetIndex) return;

      if (CONFIG.pauseAnimationOnLost) {
        try { video.pause(); } catch (_) {}
      }

      destroyActiveVideoPlane();
      activeTargetIndex = null;
      activeAnchor = null;
      scanLabel.textContent = 'POINT CAMERA AT A POSTER';
      liveBadge.textContent = 'LIVE CAMERA · SCANNING';
    }

    /* ============================================================
       START / STOP AR — IOS USER-GESTURE SAFE
       ============================================================ */

    function failStart(err) {
      console.error('AR START / RESUME ERROR', err);
      const msg = err && err.message ? err.message : String(err);
      setStatus(msg, 'bad');
      toast(msg);
      startBtn.disabled = false;
      startBtn.textContent = sessionInitialized ? 'RESUME AR' : 'TRY AGAIN';
      starting = false;

      if (sessionInitialized && arSystemRef && typeof arSystemRef.pause === 'function') {
        try { arSystemRef.pause(); } catch (_) {}
        sessionPaused = true;
        document.body.classList.remove('ar-live');
        document.body.classList.add('ar-paused');
      }
    }

    async function finishStartAR(arSystem, lifecyclePromise, isResume) {
      try {
        // IMPORTANT: arSystem.start()/unpause() was already invoked synchronously
        // by the button tap before this async continuation begins.
        if (lifecyclePromise && typeof lifecyclePromise.then === 'function') {
          await lifecyclePromise;
        }

        if (!isResume) {
          sessionInitialized = true;
        }
        sessionPaused = false;

        startCameraStyleWatch();
        styleMindARCameraVideos();

        const cam = await ensureCameraIsLive(arSystem);

        arRunning = true;
        sessionPaused = false;
        document.body.classList.remove('ar-paused');
        document.body.classList.add('ar-live');
        styleMindARCameraVideos();

        startScreen.style.display = 'none';
        scanUI.style.display = 'block';
        topBar.style.display = 'flex';
        scanLabel.textContent = 'POINT CAMERA AT A POSTER';
        liveBadge.textContent = `LIVE CAMERA · ${cam.videoWidth}×${cam.videoHeight}`;

        if (lastSeenTarget && activeTargetIndex === null) {
          setTimeout(() => {
            if (arRunning && lastSeenTarget && activeTargetIndex === null) {
              activatePoster(lastSeenTarget.item, lastSeenTarget.anchor);
            }
          }, 250);
        }

        starting = false;
      } catch (err) {
        failStart(err);
      }
    }

    // Deliberately NOT async. On iPhone Safari the MindAR start/unpause call
    // is made directly inside the user's tap event, before any await/fetch/play
    // can consume the browser's transient user activation.
    function startAR() {
      if (starting || arRunning) return;

      starting = true;
      startBtn.disabled = true;
      startBtn.textContent = sessionInitialized ? 'RESUMING…' : 'STARTING…';
      document.body.classList.remove('ar-paused');
      document.body.classList.remove('ar-live');

      try {
        if (!window.isSecureContext) {
          throw new Error('Camera access requires HTTPS. Open the published https:// URL directly in Safari.');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera API is unavailable in this browser.');
        }

        const arSystem = arSystemRef || scene.systems['mindar-image-system'];
        if (!arSystem) {
          throw new Error('MindAR is still loading. Wait until the status says READY, then tap START AR again.');
        }
        arSystemRef = arSystem;

        let lifecyclePromise = null;
        const isResume = sessionInitialized;

        if (!sessionInitialized) {
          setStatus(`STARTING CAMERA
Poster definitions: ${manifest.length}
Requesting the rear camera directly from this tap…`, 'good');
          if (typeof arSystem.start !== 'function') throw new Error('MindAR start() is unavailable.');

          // CRITICAL: invoke immediately in the click handler.
          lifecyclePromise = arSystem.start();
        } else {
          setStatus(`RESUMING CAMERA
${manifest.length} poster definitions ready.`, 'good');
          if (typeof arSystem.unpause !== 'function') throw new Error('MindAR unpause() is unavailable.');

          // CRITICAL: resume immediately in the click handler too.
          arSystem.unpause();
          lifecyclePromise = Promise.resolve();
        }

        // Continue asynchronously only AFTER camera lifecycle has been invoked.
        finishStartAR(arSystem, lifecyclePromise, isResume);

      } catch (err) {
        failStart(err);
      }
    }

    async function stopAR() {
      // This is intentionally a PAUSE, not a destructive MindAR stop().
      // MindAR officially supports pause()/unpause(); keeping the initialized
      // engine lets iPhone Safari resume AR without refreshing the page.
      try {
        const arSystem = arSystemRef || scene.systems['mindar-image-system'];
        if (arSystem && typeof arSystem.pause === 'function') {
          arSystem.pause();
        }
      } catch (err) {
        console.warn('AR pause warning:', err);
      }

      try { video.pause(); } catch (_) {}
      try { cameraPreview.pause(); } catch (_) {}

      destroyActiveVideoPlane();
      activeTargetIndex = null;
      activeAnchor = null;
      arRunning = false;
      sessionPaused = true;
      document.body.classList.remove('ar-live');
      document.body.classList.add('ar-paused');
      stopCameraStyleWatch();

      scanUI.style.display = 'none';
      topBar.style.display = 'none';
      startScreen.style.display = 'flex';
      startBtn.disabled = false;
      startBtn.textContent = 'START AR';
      setStatus(`AR paused safely.
${manifest.length} poster definitions remain loaded.
Tap START AR to resume without refreshing.`, 'good');
    }

    startBtn.addEventListener('click', startAR);
    stopBtn.addEventListener('click', stopAR);

    // If Safari still blocks playback, a tap anywhere in the AR view retries the active video.
    document.addEventListener('click', async (event) => {
      if (!arRunning || event.target === stopBtn || activeTargetIndex === null || !video.paused) return;
      try {
        await video.play();
        if (activeVideoPlane) refreshVideoTexture(activeVideoPlane);
      } catch (_) {}
    });

    /* ============================================================
       IOS / SAFARI PAGE LIFECYCLE RECOVERY
       ============================================================ */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !arRunning || sessionPaused) return;
      setTimeout(async () => {
        try {
          document.body.classList.remove('ar-paused');
          if (arSystemRef && typeof arSystemRef.unpause === 'function') arSystemRef.unpause();
          const cam = await ensureCameraIsLive(arSystemRef);
          document.body.classList.add('ar-live');
          liveBadge.textContent = `LIVE CAMERA · ${cam.videoWidth}×${cam.videoHeight}`;
          styleMindARCameraVideos();
        } catch (err) {
          console.warn('Visibility camera recovery warning:', err);
        }
      }, 120);
    });

    window.addEventListener('pageshow', () => {
      if (!arRunning || sessionPaused) return;
      setTimeout(() => ensureCameraIsLive(arSystemRef).catch(() => {}), 150);
    });

    /* ============================================================
       INITIAL PREFLIGHT
       ============================================================ */
    async function init() {
      try {
        const [, manifestInfo, targetInfo] = await Promise.all([
          waitForScene(),
          loadManifest(),
          checkTargetFile()
        ]);

        buildTargetAnchors();
        forceTransparentRenderer();
        arSystemRef = scene.systems['mindar-image-system'] || arSystemRef;
        startBtn.disabled = false;
        startBtn.textContent = 'START AR';
        setStatus(
          `READY\nPoster definitions: ${manifestInfo.count}\nManifest: ${manifestInfo.source}\n${targetInfo.length ? `targets.mind: ${targetInfo.length.toLocaleString()} bytes` : 'targets.mind: reachable'}\nOnly the detected poster's MP4 will load.
Aspect ratio: automatic from width + height (ratio field still supported).
Camera startup: iOS-safe direct-tap mode.`,
          'good'
        );
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        console.error(err);
        setStatus(msg, 'bad');
        // Keep button enabled so user can retry after redeploying files.
        startBtn.disabled = false;
        startBtn.textContent = 'START AR';
      }
    }

    scene.addEventListener('renderstart', forceTransparentRenderer);
    window.addEventListener('resize', () => setTimeout(styleMindARCameraVideos, 50));
    window.addEventListener('orientationchange', () => setTimeout(styleMindARCameraVideos, 150));
    init();
  })();
  </script>
</body>
</html>
